# schema.yml
  
  version: 2

# SOURCES
  sources:
   - name: raw
     schema: gz_raw_data
     database: genuine-octagon-484809-a1
     loader: bigquery
     tables:
       - name: sales
         identifier: raw_gz_sales
         description : sales details for each order
         tests:
           - unique:
               column_name: "(orders_id || '-' || pdt_id)"
         columns:
           - name: date_date
             description: date of sales
           - name: revenue
             description: revenue by order
           - name: quantity
             description: quantity of products by order
       - name: product
         identifier: raw_gz_product
         description: purchase price details by product
         columns:
           - name: products_id
             description: primary key
             tests:
               - unique
               - not_null
           - name: purchSE_PRICE
             description: purchase price by product
       - name: ship
         identifier: raw_gz_ship
         description: all ship costs by order
         columns:
           - name: orders_id
             description: primary key
             tests:
               - unique
               - not_null
           - name: shipping_fee
             description: shipping fee by order
           - name: shipping_fee_1
             description: shipping fee by order
           - name: logCost
             description: log cost by order
           - name: ship_cost
             description: ship cost by order

# MODELES

  models:

# Staging #
    - name: stg_raw__sales
      description: Renommage de l'id des produits

    - name: stg_raw__product
      description: Cast et renommage du prix des produits

    - name: stg_raw__ship
      description: Renommage des colonnes de coûts

# Intermediate #
    - name: int_orders_margin
      description: margin calculation per order
      columns:
       - name: orders_id
         description: primary key
         tests:
           - unique
           - not_null
       - name: margin
         description: margin = revenue - purchase_cost
         tests:
           - not_null
       - name: Purchase_cost
         description: purchase_cost = quantity * purchase_price
         tests:
           - not_null
       - name: date_date
         description: date of the order
         tests:
           - not_null
       - name: revenue
         description: sum of revenue per order
         tests:
           - not_null
       - name: quantity
         description: sum of quantity per order
         tests:
           - not_null

    - name: int_sales_margin
      description: margin calculation per order line / product sales
      columns:
       - name: orders_id
         description: orders key
         tests:
           - not_null
       - name: products_id
         description: products key
         tests:
           - not_null
       - name: margin
         description: margin = revenue - purchase_cost
         tests:
           - not_null
       - name: Purchase_cost
         description: purchase_cost = quantity * purchase_price
         tests:
           - not_null
       - name: date_date
         description: date of the order
         tests:
           - not_null
       - name: revenue
         description: sum of revenue per order
         tests:
           - not_null
       - name: quantity
         description: sum of quantity per order
         tests:
           - not_null
    - name: int_orders_operational
      description: operational margin calculation per order
      columns:
       - name: orders_id
         description: primary key
         tests:
           - unique
           - not_null
       - name: date_date
         description: date of the order
         tests:
           - not_null
       - name: operational_margin
         description: operational_margin = margin + shipping_fee - log_cost - ship_cost
       - name: quantity
         description: sum of quantity per order
         tests:
           - not_null
       - name: revenue
         description: sum of revenue per order
         tests:
           - not_null
       - name: purchase_cost
         description: purchase_cost = quantity * purchase_price
         tests:
           - not_null
       - name: margin
         description: margin = revenue - purchase_cost
         tests:
           - not_null
       - name: shipping_fee
         description: the price the customer pays for shipping
       - name: log_cost
         description: the cost of preparing the parcel in the distribution centre/warehouse
       - name: ship_cost
         description: shipping cost paid by Greenweez to the carrier/logistics provider

# Mart #
    - name: finance_days
      description: "KPIs financiers agrégés par jour, table principale pour le dashboard financier"
      columns:
      - name: date_date
        description: "Journée d'activité"
        tests:
          - unique
          - not_null
      - name: nb_transactions
        description: "Nombre de commandes uniques par jour"
      - name: average_basket
        description: "Panier moyen (revenue / nb transactions)"
      - name: operational_margin
        description: "Marge opérationnelle totale journalière"